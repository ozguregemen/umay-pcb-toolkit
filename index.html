<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Umay PCB Toolkit</title>
  <meta name="description" content="Open-source PCB and electronics calculators with lessons for hardware engineers: IPC-2152/IPC-2221 trace width, impedance, stack-up, interface rules, spacing, vias, signal integrity, RF matching, PDN, power and circuit tools. Runs in the browser, also offline. Turkish and English.">
  <meta name="theme-color" content="#a85a17">
  <meta property="og:title" content="Umay PCB Toolkit">
  <meta property="og:description" content="Open-source PCB and electronics calculators based on IPC rules.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/app.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var th = localStorage.getItem('umay.theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
  </script>
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">İçeriğe geç</a>

  <header class="topbar">
    <button id="menu-toggle" class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="sidebar" data-i18n-title="menu">
      <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="#/">
      <img src="assets/icon.svg" alt="" width="28" height="28">
      <span>Umay <b>PCB Toolkit</b></span>
    </a>
    <button type="button" class="search-btn" data-open-palette>
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span data-i18n="search">Ara</span><kbd>Ctrl K</kbd>
    </button>
    <div class="top-actions">
      <div id="units-toggle" class="toggle" role="group" data-i18n-title="unitsToggleTitle">
        <button type="button" data-u="metric" aria-pressed="true">mm</button>
        <button type="button" data-u="imperial" aria-pressed="false">mil</button>
      </div>
      <button id="lang-toggle" class="icon-btn" type="button" data-i18n-title="langToggleTitle">EN</button>
      <button id="theme-toggle" class="icon-btn" type="button" data-i18n-title="themeToggleTitle">
        <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav id="nav" class="nav" aria-label="Main"></nav>
    </aside>
    <div id="scrim" class="scrim"></div>

    <div class="content">
      <main id="main" class="main" tabindex="-1">
        <noscript><p>Umay PCB Toolkit requires JavaScript.</p></noscript>
      </main>
      <footer class="footer">
        <p data-i18n="disclaimer"></p>
        <p class="footer-links">
          <a id="repo-link" href="https://github.com/ozguregemen/umay-pcb-toolkit" rel="noopener" data-i18n="sourceCode"></a>
          <a href="tests/" data-i18n="testsLink"></a>
          <a href="https://github.com/ozguregemen/umay-pcb-toolkit/issues/new" rel="noopener" data-i18n="reportIssue"></a>
          <span>MIT</span>
        </p>
      </footer>
    </div>
  </div>
</body>
</html>
